<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>{{ if not .IsHome }}{{ partial "seitentitel.html" . }} · {{ end }}{{ site.Title }}</title>
{{ with .OutputFormats.Get "rss" }}<link rel="alternate" type="application/rss+xml" href="{{ .Permalink }}" title="{{ site.Title }}">{{ end }}
<link rel="stylesheet" href="{{ "pagefind/pagefind-ui.css" | relURL }}">
<style>
:root { --text: #222; --grau: #666; --linie: #ddd; --akzent: #8a3b12; --hinter: #fdfcf9; }
@media (prefers-color-scheme: dark) {
  :root { --text: #e6e3dc; --grau: #a29f98; --linie: #3a3833; --akzent: #e0a070; --hinter: #1c1b19; }
}
body { font: 17px/1.55 system-ui, sans-serif; color: var(--text); background: var(--hinter);
       max-width: 46rem; margin: 0 auto; padding: 1rem; }
a { color: var(--akzent); }
header { border-bottom: 1px solid var(--linie); margin-bottom: 1rem; padding-bottom: .5rem; }
header .titel { font-weight: 700; text-decoration: none; font-size: 1.2rem; }
nav a { margin-right: .8rem; font-size: .95rem; }
h1 { font-size: 1.4rem; line-height: 1.3; }
h2 { font-size: 1.1rem; margin-top: 1.6rem; }
.meta { color: var(--grau); font-size: .9rem; }
.status { font-size: .8rem; border: 1px solid var(--linie); border-radius: 4px; padding: 0 .3rem; }
ul.liste { list-style: none; padding: 0; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: .3rem .5rem; border-bottom: 1px solid var(--linie); }
ul.liste li { padding: .5rem 0; border-bottom: 1px solid var(--linie); }
article li { margin-bottom: .5rem; }
.tags a { font-size: .9rem; margin-right: .5rem; }
#suche { margin: 1rem 0 1.5rem; }
.spieler { position: sticky; bottom: 0; width: 100%; margin-top: 1rem; background: var(--hinter); }
</style>
</head>
<body>
<header>
  <a class="titel" href="{{ "" | relURL }}">{{ site.Title }}</a>
  <nav>
    <a href="{{ "" | relURL }}">Neueste</a>
    <a href="{{ "tags/" | relURL }}">Hashtags</a>
    <a href="{{ "quelle/" | relURL }}">Quellen</a>
    <a href="{{ "termine/" | relURL }}">Termine</a>
    <a href="{{ "index.xml" | relURL }}">RSS</a>
  </nav>
</header>
<main>{{ block "main" . }}{{ end }}</main>
</body>
</html>
