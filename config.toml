# Einstellungen für diesen Rechner (medienlabor)

[pfade]
daten = "/mnt/daten/lesesaal"
notizen = "/home/apollon/Arbeitsmappe_Lokal/Code/lesesaal-notizen"
whisper_modell = "/home/apollon/opt/noScribe/models/precise"

[ollama]
adresse = "http://localhost:11434"
modell = "qwen3:32b"

[[quelle]]
kennung = "hyperbandrauschen"
name = "Hyperbandrauschen"
typ = "podcast"
feed = "https://hybr.de/feed/mp3/"
sprache = "de"
zweck = "tech"
hinweise = "Die c-base erzählt ihre Geschichte als Rahmenerzählung von einer abgestürzten Raumstation aus der Zukunft. Diese Erzählung ist Fiktion und liefert keine Fundstücke. Aufnehmen nur reale Projekte, Technik und Termine."

[whisper]
karte = 1
rechenart = "float16"

[[quelle]]
kennung = "netzpolitik-offon"
name = "netzpolitik.org Off/On"
typ = "podcast"
feed = "https://netzpolitik.org/feed/podcast/off-on/"
sprache = "de"
zweck = "tech"
formate = [{muster = "On The Record", format = "gespraech"}, {muster = "Off The Record", format = "tech"}]

[seite]
adresse = "https://lesesaal.fedihive.de"

[betrieb]
rueckstand = 3                   # ältere Folgen je Quelle beim ersten Lauf; je Quelle überschreibbar
stopp_hoechstens_minuten = 10    # so lange darf ein Schritt nach dem Stoppsignal noch laufen
temperatur_pause = 83            # ab dieser Temperatur einer Karte wird angehalten
temperatur_weiter = 70           # unter dieser Temperatur aller Karten geht es weiter
fehlversuche = 3                 # danach bleibt eine Folge liegen
bericht_an = "sozialwelten"      # Empfangskonto der Direktnachricht auf ifwo.eu
bericht_als_direktnachricht = true

